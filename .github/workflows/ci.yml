name: CI
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main and the pull requests queued
  # ahead of it, and waits for the required checks on that commit.
  merge_group:
  workflow_dispatch:
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
  test:
    name: Test features (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  devcontainer:
    # Scaffolds a CAP project, boots the devcontainer it generates and makes the project's
    # first commit inside it (lint-staged + npm test). Runs on every pull request, in the
    # merge queue and on main, so a broken image or feature shows up before it is merged.
    name: Validate generated devcontainer
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:devcontainer
  test-features:
    # The single check that branch protection requires, named like the one in the other
    # cbs-consulting repositories, so one ruleset fits them all. It covers every job above,
    # so the rule does not have to list each job or Node version. always() makes it run,
    # and fail, when a job fails or is cancelled; a skipped required check would count as
    # passing.
    name: Test features
    needs: [lint, test, devcontainer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
