name: Dependabot auto-merge
# Approves Dependabot's minor and patch updates and turns on auto-merge, so they join the
# merge queue once the required checks pass and merge when they pass there too. Major
# updates can break things and wait for a person. Dependabot labels its pull requests
# "no changelog", so the changelog check passes without an entry.
#
# Needs these repository settings:
#   General -> Pull Requests: "Allow auto-merge"
#   Actions -> General -> Workflow permissions: "Allow GitHub Actions to create and approve
#   pull requests" (only if the branch rule requires an approval)
on: pull_request
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2
      # Fails when Actions may not approve pull requests; auto-merge is still turned on.
      - name: Approve
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR"
      # The merge queue uses its own merge method; --squash applies only without a queue.
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
